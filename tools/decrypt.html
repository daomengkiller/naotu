<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>脑图数据离线解码工具</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
	* { box-sizing: border-box; }
	body {
		font-family: 'Microsoft Yahei', 'PingFang SC', sans-serif;
		background: #2C3344;
		margin: 0; padding: 40px 16px;
		color: #333;
	}
	.box {
		max-width: 560px; margin: 0 auto;
		background: #fff; border-radius: 10px;
		padding: 32px 36px;
		box-shadow: 0 12px 40px rgba(0,0,0,.3);
	}
	h1 { font-size: 20px; margin: 0 0 6px; }
	.sub { font-size: 13px; color: #888; margin-bottom: 22px; line-height: 1.7; }
	label { display: block; font-size: 13px; color: #555; margin: 14px 0 6px; }
	input[type=password], input[type=text], input[type=file] {
		width: 100%; height: 40px;
		border: 1px solid #d5d9e0; border-radius: 6px;
		padding: 0 12px; font-size: 14px;
	}
	input[type=file] { padding: 8px; height: auto; }
	.btn {
		width: 100%; height: 44px; margin-top: 20px;
		background: #4A90E2; color: #fff; border: none;
		border-radius: 6px; font-size: 15px; cursor: pointer;
	}
	.btn:hover { background: #3a7fd0; }
	.btn:disabled { background: #b8c4d4; cursor: not-allowed; }
	.hint { font-size: 12px; color: #EB5757; min-height: 18px; margin-top: 10px; }
	.ok { color: #27ae60; }
	.result { margin-top: 16px; font-size: 13px; line-height: 1.8; word-break: break-all; }
	.result a { color: #4A90E2; }
	.files { margin-top: 12px; }
	.file-row {
		display: flex; align-items: center; justify-content: space-between;
		padding: 8px 10px; border: 1px solid #eef0f4; border-radius: 6px; margin-bottom: 6px;
		font-size: 13px;
	}
	.file-row .fname { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; margin-right: 10px; }
	.file-row button {
		background: #4A90E2; color: #fff; border: none; border-radius: 4px;
		padding: 4px 12px; font-size: 12px; cursor: pointer; flex-shrink: 0;
	}
	.file-row button:hover { background: #3a7fd0; }
	.file-row .status { font-size: 12px; flex-shrink: 0; margin-left: 8px; }
	.multi { border-top: 1px dashed #e0e4ea; margin-top: 20px; padding-top: 4px; }
	.note { font-size: 12px; color: #999; margin-top: 18px; line-height: 1.7; }
</style>
</head>
<body>
<div class="box">
	<h1>🔓 脑图数据离线解码工具</h1>
	<div class="sub">用于在网站无法访问时，从云端下载的密文脑图文件（<b>KMENC1:</b> 开头）中恢复明文。
		完全离线运行，不会上传任何数据。算法与脑图网站完全一致。</div>

	<label>访问密码（即登录脑图网站的密码）</label>
	<input type="password" id="password" placeholder="输入你的密码" autocomplete="off">

	<label>选择密文脑图文件（可多选，支持 .km / .txt / 任意文本文件）</label>
	<input type="file" id="files" multiple accept=".km,.txt,.json,.mm,.xmind">

	<button class="btn" id="btnDecrypt">解密所选文件</button>
	<div class="hint" id="hint"></div>

	<div class="files" id="fileList"></div>
	<div class="result" id="result"></div>

	<div class="note">
		提示：密文文件可以从 Gitee/GitHub 仓库的 <b>mindmaps/</b> 目录下载（网页里直接打开文件复制内容，
		或 git clone 仓库后取文件）。解密后得到的是标准 .km 明文文件，可用任意 kityminder 工具打开，
		或重新导入到脑图网站。
	</div>
</div>

<script>
(function() {
	'use strict';

	var DATA_SALT = 'km-data-v1-fixed-salt';
	var ENC_PREFIX = 'KMENC1:';
	var ITERATIONS = 150000;

	var selectedFiles = [];
	var $password = document.getElementById('password');
	var $files = document.getElementById('files');
	var $btn = document.getElementById('btnDecrypt');
	var $hint = document.getElementById('hint');
	var $list = document.getElementById('fileList');
	var $result = document.getElementById('result');

	function b64ToBuf(b64) {
		var bin = atob(b64);
		var bytes = new Uint8Array(bin.length);
		for (var i = 0; i < bin.length; i++) bytes[i] = bin.charCodeAt(i);
		return bytes;
	}

	function bufToB64(buf) {
		var bytes = new Uint8Array(buf);
		var bin = '';
		bytes.forEach(function(b) { bin += String.fromCharCode(b); });
		return btoa(bin);
	}

	function deriveKey(password, saltBuf) {
		var enc = new TextEncoder();
		return crypto.subtle.importKey('raw', enc.encode(password), 'PBKDF2', false, ['deriveKey'])
			.then(function(baseKey) {
				return crypto.subtle.deriveKey(
					{ name: 'PBKDF2', salt: saltBuf, iterations: ITERATIONS, hash: 'SHA-256' },
					baseKey,
					{ name: 'AES-GCM', length: 256 },
					false,
					['decrypt']
				);
			});
	}

	function aesGcmDecrypt(key, ivBuf, dataBuf) {
		var dec = new TextDecoder();
		return crypto.subtle.decrypt({ name: 'AES-GCM', iv: ivBuf }, key, dataBuf)
			.then(function(plain) { return dec.decode(plain); });
	}

	/** 解密文本：KMENC1: 前缀 -> 解密；否则原样返回 */
	function decryptText(key, text) {
		if (!text || text.indexOf(ENC_PREFIX) !== 0) {
			return Promise.resolve({ plain: text, encrypted: false });
		}
		var rest = text.substring(ENC_PREFIX.length);
		var dotIdx = rest.indexOf('.');
		if (dotIdx < 0) return Promise.reject(new Error('加密数据格式错误'));
		var iv = b64ToBuf(rest.substring(0, dotIdx));
		var data = b64ToBuf(rest.substring(dotIdx + 1));
		return aesGcmDecrypt(key, iv, data).then(function(plain) {
			return { plain: plain, encrypted: true };
		});
	}

	function downloadFile(name, content) {
		var blob = new Blob([content], { type: 'application/json;charset=utf-8' });
		var url = URL.createObjectURL(blob);
		var a = document.createElement('a');
		a.href = url;
		a.download = name.replace(/\.km$/, '') + '.decrypted.km';
		document.body.appendChild(a);
		a.click();
		document.body.removeChild(a);
		setTimeout(function() { URL.revokeObjectURL(url); }, 3000);
	}

	function renderList() {
		$list.innerHTML = '';
		selectedFiles.forEach(function(f, i) {
			var row = document.createElement('div');
			row.className = 'file-row';
			row.innerHTML = '<span class="fname">' + f.name + ' (' + (f.size / 1024).toFixed(1) + ' KB)</span>' +
				'<button data-i="' + i + '">解密</button>' +
				'<span class="status" id="st-' + i + '"></span>';
			$list.appendChild(row);
		});
		Array.prototype.forEach.call($list.querySelectorAll('button'), function(btn) {
			btn.addEventListener('click', function() {
				decryptOne(parseInt(btn.getAttribute('data-i'), 10));
			});
		});
	}

	function setStatus(i, text, ok) {
		var el = document.getElementById('st-' + i);
		if (el) {
			el.textContent = text;
			el.style.color = ok ? '#27ae60' : '#EB5757';
		}
	}

	function decryptOne(i) {
		var f = selectedFiles[i];
		var password = $password.value;
		if (!password) {
			$hint.textContent = '请先输入密码';
			return;
		}
		if (password.length < 4) {
			$hint.textContent = '密码太短，请检查是否输入正确';
			return;
		}
		$hint.textContent = '';
		setStatus(i, '解密中…', true);
		$btn.disabled = true;

		var reader = new FileReader();
		reader.onload = function() {
			var text = String(reader.result);
			deriveKey(password, new TextEncoder().encode(DATA_SALT))
				.then(function(key) { return decryptText(key, text); })
				.then(function(res) {
					if (!res.encrypted) {
						setStatus(i, '⚠ 未加密文件（无需解密）', false);
						$hint.textContent = '「' + f.name + '」不是加密格式，直接可用。';
					} else {
						downloadFile(f.name, res.plain);
						setStatus(i, '✓ 已解密并下载', true);
						$result.innerHTML = '「<b>' + f.name + '</b>」解密成功！已下载为 ' +
							f.name.replace(/\.km$/, '') + '.decrypted.km<br>可导入任何 kityminder 工具打开。';
					}
					$btn.disabled = false;
				})
				.catch(function(e) {
					setStatus(i, '✗ 失败', false);
					$hint.textContent = '「' + f.name + '」解密失败：' + e.message + '（密码错误或文件损坏）';
					$btn.disabled = false;
				});
		};
		reader.onerror = function() {
			setStatus(i, '✗ 读取失败', false);
			$btn.disabled = false;
		};
		reader.readAsText(f, 'utf-8');
	}

	$files.addEventListener('change', function() {
		selectedFiles = Array.prototype.slice.call($files.files || []);
		$result.innerHTML = '';
		if (selectedFiles.length) {
			renderList();
		}
	});

	$btn.addEventListener('click', function() {
		if (!selectedFiles.length) {
			$hint.textContent = '请先选择密文脑图文件';
			return;
		}
		var password = $password.value;
		if (!password) {
			$hint.textContent = '请先输入密码';
			return;
		}
		$result.innerHTML = '';
		// 逐个解密（单个文件解密，避免浏览器同时触发多个下载被拦截）
		decryptOne(0);
	});
})();
</script>
</body>
</html>
